name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependency
        run: python3 -m pip install --quiet pyarrow==25.0.0
      - name: Run dataset conversion regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate fleet shell
        run: bash -n fleet.sh fleet-status.sh publish-prebuilt-index.sh
