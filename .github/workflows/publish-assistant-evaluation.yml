name: publish-assistant-evaluation

on:
  workflow_dispatch:
    inputs:
      evaluation_release:
        description: Exact retry-safe assistant-evaluation release tag
        required: true
        type: string
      candidate_revision:
        description: Exact zero-traffic Container Apps revision evaluated
        required: true
        type: string
      bootstrap_rollback_revision:
        description: Optional first-release equivalent fallback created before the candidate
        required: false
        default: ""
        type: string
      bootstrap_canonical_template_digest:
        description: Optional canonical R/C revision-template digest (excluding revisionSuffix)
        required: false
        default: ""
        type: string
      bootstrap_expected_image_digest:
        description: Optional exact shared R/C image digest
        required: false
        default: ""
        type: string

permissions:
  attestations: read
  contents: write
  id-token: write

concurrency:
  # Serialize every candidate lifecycle inside lex-ops. GitHub concurrency is repository-scoped;
  # the production-environment/branch audit remains the cross-repository sequencing prerequisite.
  group: lex-production
  cancel-in-progress: false

jobs:
  acquire_candidate_ownership:
    if: github.ref == 'refs/heads/main'
    permissions:
      # This job resolves the evaluation release while it is still a draft, and GitHub exposes
      # draft releases only to tokens with push access. Read-only contents made every dispatch
      # fail at the first step with "release not found", before any identity check could run.
      contents: write
      id-token: write
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bootstrap_mode: ${{ steps.acquire.outputs.bootstrap_mode }}
      candidate_owned: ${{ steps.acquire.outputs.candidate_owned }}
      evaluation_release_id: ${{ steps.acquire.outputs.evaluation_release_id }}
      public_retry: ${{ steps.acquire.outputs.public_retry }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVALUATION_RELEASE: ${{ inputs.evaluation_release }}
      EVALUATION_REPOSITORY: SFHAJJI/lex-ops
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
      BOOTSTRAP_ROLLBACK_REVISION: ${{ inputs.bootstrap_rollback_revision }}
      BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST: ${{ inputs.bootstrap_canonical_template_digest }}
      BOOTSTRAP_EXPECTED_IMAGE_DIGEST: ${{ inputs.bootstrap_expected_image_digest }}
      RESOURCE_GROUP: rg-platform
      CONTAINER_APP: ca-lex-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Azure login for read-only candidate acquisition
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Acquire durable cleanup ownership before any candidate mutation
        id: acquire
        shell: bash
        run: |
          set -euo pipefail
          . scripts/assistant_evaluation_release_contract.sh
          [[ "$EVALUATION_RELEASE" =~ ^assistant-eval-[0-9a-f]{12}-[0-9a-f]{12}$ ]] \
            && [[ "$CANDIDATE_REVISION" =~ ^ca-lex-web--[a-z0-9-]+$ ]] \
            || { echo "::error::candidate acquisition identity is malformed"; exit 2; }
          supplied=0
          for value in BOOTSTRAP_ROLLBACK_REVISION \
              BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST BOOTSTRAP_EXPECTED_IMAGE_DIGEST; do
            [ -n "${!value}" ] && supplied=$((supplied + 1))
          done
          [ "$supplied" = 0 ] || [ "$supplied" = 3 ] \
            || { echo "::error::bootstrap equivalence inputs must be supplied together"; exit 2; }
          bootstrap_mode=false
          if [ "$supplied" = 3 ]; then
            bootstrap_mode=true
            [[ "$BOOTSTRAP_ROLLBACK_REVISION" =~ ^ca-lex-web--[a-z0-9-]+$ ]] \
              && [ "$BOOTSTRAP_ROLLBACK_REVISION" != "$CANDIDATE_REVISION" ] \
              && [[ "$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              && [[ "$BOOTSTRAP_EXPECTED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::bootstrap acquisition identity is malformed"; exit 2; }
          fi

          release_locator="$RUNNER_TEMP/evaluation-release-acquisition.json"
          gh release view "$EVALUATION_RELEASE" --repo "$EVALUATION_REPOSITORY" \
            --json databaseId,tagName \
            > "$release_locator"
          evaluation_release_id=$(jq -er --arg tag "$EVALUATION_RELEASE" '
            select(.tagName == $tag)
            | .databaseId
            | select(type == "number" and . > 0 and . == floor)
          ' "$release_locator") \
            || { echo "::error::candidate acquisition release locator is not exact"; exit 2; }
          acquired_release="$RUNNER_TEMP/evaluation-release-acquired.json"
          gh api --method GET -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$EVALUATION_REPOSITORY/releases/$evaluation_release_id" \
            > "$acquired_release"
          release_state=$(jq -er --argjson id "$evaluation_release_id" \
            --arg tag "$EVALUATION_RELEASE" '
            select(.id == $id and .tag_name == $tag and .target_commitish == "main"
              and .prerelease == false and (.assets | type) == "array"
              and ([.assets[].id] | length) == ([.assets[].id] | unique | length)
              and ([.assets[].name] | length) == ([.assets[].name] | unique | length))
            | if .draft == true and .immutable == false then "draft"
            elif .draft == false and .immutable == true then "public"
            else error("release state is not exact") end
          ' "$acquired_release") \
            || { echo "::error::candidate acquisition release state is not exact"; exit 2; }
          public_retry=false
          [ "$release_state" = public ] && public_retry=true

          download_acquisition_asset() {
            local name="$1" maximum_size="$2" output="$3"
            local asset asset_id asset_digest expected_sha expected_size actual_sha actual_size
            asset=$(jq -ec --arg name "$name" --argjson maximum "$maximum_size" '
              [.assets[] | select(.name == $name)]
              | select(length == 1) | .[0]
              | select((.id | type) == "number" and (.id % 1) == 0 and .id > 0
                  and (.digest | type) == "string"
                  and (.digest | test("^sha256:[0-9a-f]{64}$"))
                  and (.size | type) == "number" and (.size % 1) == 0
                  and .size > 0 and .size <= $maximum and .state == "uploaded")
            ' "$acquired_release") || return 1
            asset_id=$(jq -r '.id' <<< "$asset") || return 1
            asset_digest=$(jq -r '.digest' <<< "$asset") || return 1
            expected_sha=${asset_digest#sha256:}
            expected_size=$(jq -r '.size' <<< "$asset") || return 1
            gh api --method GET -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$EVALUATION_REPOSITORY/releases/assets/$asset_id" \
              > "$output" || return 1
            actual_sha=$(sha256sum "$output" | cut -d' ' -f1) || return 1
            actual_size=$(wc -c < "$output" | tr -d ' ') || return 1
            [ "$actual_sha" = "$expected_sha" ] \
              && [ "$actual_size" = "$expected_size" ]
          }

          report_asset=$(jq -ec '
            [.assets[] | select(.name == "assistant-eval-report.json")]
            | select(length == 1) | .[0]
            | select((.id | type) == "number" and (.id % 1) == 0 and .id > 0
                and (.digest | type) == "string"
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
                and (.size | type) == "number" and (.size % 1) == 0
                and .size > 0 and .size <= 4194304 and .state == "uploaded")
          ' "$acquired_release") \
            || { echo "::error::candidate acquisition report asset is not exact"; exit 2; }
          report_asset_id=$(jq -r '.id' <<< "$report_asset")
          expected_report_size=$(jq -r '.size' <<< "$report_asset")
          acquired_report="$RUNNER_TEMP/assistant-eval-report.acquired.json"
          report_asset_digest=$(jq -r '.digest' <<< "$report_asset")
          expected_report_sha=${report_asset_digest#sha256:}
          gh api --method GET -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$EVALUATION_REPOSITORY/releases/assets/$report_asset_id" \
            > "$acquired_report"
          actual_report_sha=$(sha256sum "$acquired_report" | cut -d' ' -f1)
          actual_report_size=$(wc -c < "$acquired_report" | tr -d ' ')
          [ "$actual_report_sha" = "$expected_report_sha" ] \
            && [ "$actual_report_size" = "$expected_report_size" ] \
            || { echo "::error::candidate acquisition report bytes changed"; exit 2; }
          acquired_admission="$RUNNER_TEMP/assistant-eval-admission.acquired.json"
          acquired_admission_signature="$RUNNER_TEMP/assistant-eval-admission.acquired.sig"
          download_acquisition_asset \
            assistant-eval-admission.json 32768 "$acquired_admission" \
            || { echo "::error::candidate acquisition admission asset is not exact"; exit 2; }
          download_acquisition_asset \
            assistant-eval-admission.sig 514 "$acquired_admission_signature" \
            || { echo "::error::candidate acquisition admission signature is not exact"; exit 2; }
          # Acquisition establishes exact asset bytes and report binding only.
          # Signature verification is deliberately deferred to exact evaluated Lex after bounded
          # zero-traffic activation and before browser evidence, signing, or publication.
          report_binding=$(jq -er --arg candidate "$CANDIDATE_REVISION" '
            select(.schema == "lex-assistant-eval-report/3"
              and .activation_gate_passed == true and .gate_failures == []
              and .identity.target.revision_name == $candidate
              and (.identity.target.code_commit | type) == "string"
              and (.identity.target.code_commit | test("^[0-9a-f]{40}$"))
              and (.admission_sha256 | type) == "string"
              and (.admission_sha256 | test("^[0-9a-f]{64}$"))
              and (.admission_run_identity | type) == "string"
              and (.admission_run_identity | test("^[0-9a-f]{16}$")))
            | [.identity.target.code_commit, .admission_sha256,
                .admission_run_identity] | @tsv
          ' "$acquired_report") \
            || { echo "::error::candidate acquisition report identity is not exact"; exit 2; }
          IFS=$'\t' read -r report_code_commit report_admission_sha \
            report_admission_run_identity <<< "$report_binding"
          actual_admission_sha=$(sha256sum "$acquired_admission" | cut -d' ' -f1)
          [ "$actual_admission_sha" = "$report_admission_sha" ] \
            || { echo "::error::candidate acquisition report does not bind admission bytes"; exit 2; }
          admission_nonce=$(jq -er '
            select(.schema == "lex-assistant-eval-admission/1")
            | .nonce | select(type == "string"
                and test("^[A-Za-z0-9_-]{43}$"))
          ' "$acquired_admission") \
            || { echo "::error::candidate acquisition admission identity is malformed"; exit 2; }
          admission_run_identity=$(printf '%s' "$admission_nonce" | sha256sum \
            | cut -c1-16)
          [ "$admission_run_identity" = "$report_admission_run_identity" ] \
            || { echo "::error::candidate acquisition report does not bind admission run"; exit 2; }
          bound_release="assistant-eval-${report_code_commit:0:12}-${actual_report_sha:0:12}"
          [ "$bound_release" = "$EVALUATION_RELEASE" ] \
            || { echo "::error::candidate acquisition release does not bind report bytes"; exit 2; }

          candidate_owned=false
          if [ "$bootstrap_mode" = true ]; then
            validate_bootstrap_abandonment_prestate "$RESOURCE_GROUP" "$CONTAINER_APP" \
              "$CANDIDATE_REVISION" "$BOOTSTRAP_ROLLBACK_REVISION" \
              || { echo "::error::bootstrap acquisition state is not exact A/R/C"; exit 1; }
            [ "$release_state" = draft ] && candidate_owned=true
          else
            candidate_state="$RUNNER_TEMP/evaluation-candidate-acquisition.json"
            az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --revision "$CANDIDATE_REVISION" -o json > "$candidate_state"
            jq -e --arg candidate "$CANDIDATE_REVISION" '
              .name == $candidate
              and (.properties.active | type) == "boolean"
              and (.properties.trafficWeight // 0) == 0
            ' "$candidate_state" >/dev/null \
              || { echo "::error::candidate acquisition refuses a live or malformed revision"; exit 1; }
            candidate_active=$(jq -r '.properties.active' "$candidate_state")
            if [ "$release_state" = public ] && [ "$candidate_active" = true ]; then
              candidate_owned=true
            elif [ "$release_state" = draft ]; then
              [ "$candidate_active" = false ] \
                || { echo "::error::standard acquisition requires inactive C"; exit 1; }
              candidate_owned=true
            fi
          fi
          echo "bootstrap_mode=$bootstrap_mode" >> "$GITHUB_OUTPUT"
          echo "candidate_owned=$candidate_owned" >> "$GITHUB_OUTPUT"
          echo "evaluation_release_id=$evaluation_release_id" >> "$GITHUB_OUTPUT"
          echo "public_retry=$public_retry" >> "$GITHUB_OUTPUT"

  prepare:
    needs: acquire_candidate_ownership
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      admission_expires_at: ${{ steps.stage.outputs.admission_expires_at }}
      bootstrap_mode: ${{ steps.resolve.outputs.bootstrap_mode }}
      bootstrap_routes_sha256: ${{ steps.stage.outputs.bootstrap_routes_sha256 }}
      cases_sha256: ${{ steps.identity.outputs.cases_sha256 }}
      code_commit: ${{ steps.identity.outputs.code_commit }}
      evaluation_release_id: ${{ steps.resolve.outputs.evaluation_release_id }}
      public_retry: ${{ steps.resolve.outputs.public_retry }}
      release_inventory_sha256: ${{ steps.stage.outputs.release_inventory_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVALUATION_RELEASE: ${{ inputs.evaluation_release }}
      EVALUATION_REPOSITORY: SFHAJJI/lex-ops
      WORKFLOW_COMMIT: ${{ github.sha }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
      BOOTSTRAP_ROLLBACK_REVISION: ${{ inputs.bootstrap_rollback_revision }}
      BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST: ${{ inputs.bootstrap_canonical_template_digest }}
      BOOTSTRAP_EXPECTED_IMAGE_DIGEST: ${{ inputs.bootstrap_expected_image_digest }}
      RESOURCE_GROUP: rg-platform
      CONTAINER_APP: ca-lex-web
      AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
      AZURE_KEY_NAME: ${{ vars.AZURE_KEY_NAME }}
      AZURE_KEY_VERSION: ${{ vars.AZURE_KEY_VERSION }}
      ARTIFACT_KEY_ID: ${{ vars.ARTIFACT_KEY_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACQUIRED_BOOTSTRAP_MODE: ${{ needs.acquire_candidate_ownership.outputs.bootstrap_mode }}
      ACQUIRED_EVALUATION_RELEASE_ID: ${{ needs.acquire_candidate_ownership.outputs.evaluation_release_id }}
      ACQUIRED_PUBLIC_RETRY: ${{ needs.acquire_candidate_ownership.outputs.public_retry }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download the exact draft or immutable public evidence
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          EVALUATION_RELEASE_CONTRACT="$GITHUB_WORKSPACE/scripts/assistant_evaluation_release_contract.sh"
          echo "EVALUATION_RELEASE_CONTRACT=$EVALUATION_RELEASE_CONTRACT" >> "$GITHUB_ENV"
          . "$EVALUATION_RELEASE_CONTRACT"
          [[ "$EVALUATION_RELEASE" =~ ^assistant-eval-[0-9a-f]{12}-[0-9a-f]{12}$ ]] \
            || { echo "::error::invalid evaluation release tag"; exit 2; }
          [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::invalid protected workflow commit"; exit 2; }
          [[ "$CANDIDATE_REVISION" =~ ^ca-lex-web--[a-z0-9-]+$ ]] \
            || { echo "::error::invalid candidate revision"; exit 2; }
          supplied=0
          for value in BOOTSTRAP_ROLLBACK_REVISION \
              BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST BOOTSTRAP_EXPECTED_IMAGE_DIGEST; do
            [ -n "${!value}" ] && supplied=$((supplied + 1))
          done
          [ "$supplied" = 0 ] || [ "$supplied" = 3 ] \
            || { echo "::error::bootstrap equivalence inputs must be supplied together"; exit 2; }
          bootstrap_mode=false
          if [ "$supplied" = 3 ]; then
            bootstrap_mode=true
            [[ "$BOOTSTRAP_ROLLBACK_REVISION" =~ ^ca-lex-web--[a-z0-9-]+$ ]] \
              && [ "$BOOTSTRAP_ROLLBACK_REVISION" != "$CANDIDATE_REVISION" ] \
              || { echo "::error::invalid bootstrap fallback revision"; exit 2; }
            [[ "$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              && [[ "$BOOTSTRAP_EXPECTED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::invalid bootstrap equivalence digest"; exit 2; }
          fi
          [ "$bootstrap_mode" = "$ACQUIRED_BOOTSTRAP_MODE" ] \
            || { echo "::error::candidate acquisition mode changed"; exit 2; }
          echo "BOOTSTRAP_MODE=$bootstrap_mode" >> "$GITHUB_ENV"
          echo "bootstrap_mode=$bootstrap_mode" >> "$GITHUB_OUTPUT"
          allowed=$(jq -cn --argjson bootstrap "$bootstrap_mode" '
            [
              "assistant-eval-report.json",
              "assistant-cases-v3.json",
              "assistant-cases-v3.review.json",
              "assistant-cases-v3.review.sig",
              "assistant-eval-admission.json",
              "assistant-eval-admission.sig",
              "assistant-browser-evidence.json",
              "assistant-eval.manifest.json",
              "assistant-eval.manifest.sig"
            ] + (if $bootstrap then [
              "bootstrap-equivalence.json",
              "bootstrap-equivalence.manifest.json",
              "bootstrap-equivalence.manifest.sig"
            ] else [] end) | sort')
          required=$(jq -cn '[
            "assistant-eval-report.json",
            "assistant-cases-v3.json",
            "assistant-cases-v3.review.json",
            "assistant-cases-v3.review.sig",
            "assistant-eval-admission.json",
            "assistant-eval-admission.sig"
          ]')
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
          EVALUATION_RELEASE_ID=$(
            gh release view "$EVALUATION_RELEASE" --repo "$EVALUATION_REPOSITORY" \
              --json databaseId,tagName \
            | jq -er --arg tag "$EVALUATION_RELEASE" '
              if .tagName == $tag
                and ((.databaseId | type) == "number")
                and .databaseId > 0
                and .databaseId == (.databaseId | floor)
              then (.databaseId | tostring)
              else error("release locator is not exact") end
            '
          ) \
            || { echo "::error::evaluation release locator is not exact"; exit 2; }
          [ "$EVALUATION_RELEASE_ID" = "$ACQUIRED_EVALUATION_RELEASE_ID" ] \
            || { echo "::error::candidate acquisition release changed"; exit 2; }
          echo "EVALUATION_RELEASE_ID=$EVALUATION_RELEASE_ID" >> "$GITHUB_ENV"
          echo "evaluation_release_id=$EVALUATION_RELEASE_ID" >> "$GITHUB_OUTPUT"
          entry_release="$RUNNER_TEMP/evaluation-release-entry.json"
          fetch_release_snapshot "$entry_release"
          release_state=$(jq -er --arg tag "$EVALUATION_RELEASE" \
            --arg target main --argjson allowed "$allowed" \
            --argjson required "$required" '
              (.tag_name == $tag and .target_commitish == $target
                and .prerelease == false and ((.assets | type) == "array")
                and ([.assets[].name] | length) == ([.assets[].name] | unique | length)
                and (($required - [.assets[].name]) | length == 0)
                and (([.assets[].name] - $allowed) | length == 0)
                and (all(.assets[];
                  (.digest | type) == "string"
                  and (.digest | test("^sha256:[0-9a-f]{64}$"))
                  and (.size | type) == "number" and (.size % 1 == 0) and .size >= 0
                  and .state == "uploaded"))
              ) as $common
              | if ($common and .draft == true and .immutable == false) then "draft"
                elif ($common and .draft == false and .immutable == true
                  and ([.assets[].name] | sort) == $allowed) then "public"
                else error("evaluation release is not exact") end
            ' "$entry_release") \
            || { echo "::error::evaluation release is not an exact retry-safe release"; exit 2; }
          if [ "$release_state" = public ]; then
            public_retry=true
          else
            public_retry=false
          fi
          [ "$public_retry" = "$ACQUIRED_PUBLIC_RETRY" ] \
            || { echo "::error::candidate acquisition release state changed"; exit 2; }
          echo "PUBLIC_RETRY=$public_retry" >> "$GITHUB_ENV"
          echo "public_retry=$public_retry" >> "$GITHUB_OUTPUT"
          entry_names="$RUNNER_TEMP/evaluation-release-entry-names.json"
          jq '[.assets[].name] | sort' "$entry_release" > "$entry_names"
          download_release_assets_by_id evidence "$entry_release" \
            || { echo "::error::evaluation release asset download is incomplete"; exit 1; }
          entry_recheck="$RUNNER_TEMP/evaluation-release-entry-recheck.json"
          entry_tag="$RUNNER_TEMP/evaluation-release-entry-tag.json"
          fetch_release_snapshot "$entry_recheck"
          entry_attest=false
          if [ "$release_state" = public ]; then
            entry_attest=true
          fi
          validate_release_snapshot "$release_state" evidence "$entry_names" \
            "$entry_recheck" "$entry_attest" \
            || { echo "::error::release metadata, attestation, or read-back differs"; exit 1; }
          python3 scripts/assistant_evaluation_identity.py \
            evidence/assistant-eval-report.json \
            "$CANDIDATE_REVISION" "$EVALUATION_RELEASE" "$GITHUB_ENV"
          report_admission_sha=$(jq -er '
            .admission_sha256
            | select(type == "string" and test("^[0-9a-f]{64}$"))
          ' evidence/assistant-eval-report.json)
          [ "$(sha256sum evidence/assistant-eval-admission.json | cut -d' ' -f1)" \
              = "$report_admission_sha" ] \
            || { echo "::error::report does not bind the downloaded admission"; exit 2; }
          ensure_release_tag "$release_state" "$entry_tag" \
            || { echo "::error::release tag is not a direct exact workflow commit"; exit 1; }

      - name: Check out the exact evaluated Lex commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/SFHAJJI/lex.git lex
          git -C lex checkout --detach "$CODE_COMMIT"
          test "$(git -C lex rev-parse HEAD)" = "$CODE_COMMIT"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lex/web/package-lock.json

      - name: Install the exact browser evaluation runtime
        if: env.PUBLIC_RETRY != 'true'
        working-directory: lex/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Require production signer configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in AZURE_KEY_VAULT AZURE_KEY_NAME AZURE_KEY_VERSION ARTIFACT_KEY_ID; do
            [ -n "${!value:-}" ] || { echo "::error::$value is not configured"; exit 1; }
          done
          [[ "$AZURE_KEY_VERSION" =~ ^[0-9a-f]{32}$ ]] \
            || { echo "::error::artifact key version is invalid"; exit 1; }
          [ "$ARTIFACT_KEY_ID" = "keyvault-lex-v2" ] \
            || { echo "::error::artifact key id is not the Lex v2 trust root"; exit 1; }
          git -C lex merge-base --is-ancestor "$CODE_COMMIT" refs/remotes/origin/main \
            || { echo "::error::evaluated code is not on Lex main"; exit 2; }

      - name: Azure login for authenticated evidence and non-exportable signing
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate, sign, verify, and stage the evidence
        id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          . "$EVALUATION_RELEASE_CONTRACT"
          . lex/scripts/deploy/az-retry.sh
          . lex/scripts/deploy/az-reauth.sh
          az_reauth
          candidate_owned=false
          cleanup_candidate() {
            [ "$candidate_owned" = "true" ] || return 0
            az_reauth || true
            if [ "$BOOTSTRAP_MODE" = true ]; then
              validate_bootstrap_abandonment_prestate "$RESOURCE_GROUP" "$CONTAINER_APP" \
                "$CANDIDATE_REVISION" "$BOOTSTRAP_ROLLBACK_REVISION" \
                || { echo "::error::bootstrap state drifted; retain C for explicit recovery"; return 1; }
            fi
            deactivate_zero_traffic_candidate "$RESOURCE_GROUP" "$CONTAINER_APP" "$CANDIDATE_REVISION" \
              || { echo "::error::candidate revision could not be safely deactivated"; return 1; }
          }
          finish() {
            local status=$?
            trap - EXIT TERM INT
            if [ "$status" -ne 0 ]; then
              cleanup_candidate || status=1
            fi
            exit "$status"
          }
          trap finish EXIT TERM INT
          app_id=$(az_retry az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --query id -o tsv)
          candidate_fqdn=$(az_retry az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --revision "$CANDIDATE_REVISION" --query properties.fqdn -o tsv)
          candidate_traffic=$(az_retry az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --revision "$CANDIDATE_REVISION" --query properties.trafficWeight -o tsv)
          [ -n "$app_id" ] && [ -n "$candidate_fqdn" ] \
            || { echo "::error::candidate identity is incomplete"; exit 1; }
          [ "$candidate_traffic" = "0" ] \
            || { echo "::error::assistant evaluation must run against a zero-traffic candidate"; exit 1; }
          candidate_active=$(az_retry az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --revision "$CANDIDATE_REVISION" --query properties.active -o tsv)
          if [ "$PUBLIC_RETRY" = "true" ]; then
            if [ "$BOOTSTRAP_MODE" = "true" ]; then
              [ "$candidate_active" = "true" ] \
                || { echo "::error::public bootstrap retry requires C active at zero traffic"; exit 1; }
            else
              { [ "$candidate_active" = "true" ] || [ "$candidate_active" = "false" ]; } \
                || { echo "::error::public evaluation retry candidate state is malformed"; exit 1; }
              # A hard cancellation can skip the original trap after publication. Own only the
              # standard candidate cleanup; bootstrap C must remain active for promotion.
              if [ "$candidate_active" = "true" ]; then
                candidate_owned=true
              fi
            fi
            dotnet run --project lex/src/Lex.Ingest/Lex.Ingest.csproj -c Release -- \
              assistant-eval verify-release \
              --root evidence \
              --manifest evidence/assistant-eval.manifest.json \
              --signature evidence/assistant-eval.manifest.sig \
              --trust-roots lex/deploy/trusted-artifact-roots.json \
              --base-url "https://$candidate_fqdn" \
              --candidate-container-app-resource-id "$app_id" \
              --candidate-revision "$CANDIDATE_REVISION"
            if [ "$BOOTSTRAP_MODE" = "true" ]; then
              legacy_authority=$(jq -er .legacy_authority.revision_name \
                evidence/bootstrap-equivalence.json)
              dotnet run --project lex/src/Lex.Ingest/Lex.Ingest.csproj -c Release -- \
                assistant-eval verify-bootstrap-equivalence \
                --root evidence \
                --manifest evidence/bootstrap-equivalence.manifest.json \
                --signature evidence/bootstrap-equivalence.manifest.sig \
                --trust-roots lex/deploy/trusted-artifact-roots.json \
                --equivalence evidence/bootstrap-equivalence.json \
                --candidate-container-app-resource-id "$app_id" \
                --legacy-authority-revision "$legacy_authority" \
                --candidate-revision "$CANDIDATE_REVISION" \
                --rollback-revision "$BOOTSTRAP_ROLLBACK_REVISION" \
                --evaluation-release "$EVALUATION_RELEASE" \
                --canonical-template-digest "$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" \
                --image-digest "$BOOTSTRAP_EXPECTED_IMAGE_DIGEST" \
                --cases-sha256 "$CASES_SHA"
            fi
            exit 0
          fi
          if [ "$BOOTSTRAP_MODE" = "true" ]; then
            [ "$candidate_active" = "true" ] \
              || { echo "::error::bootstrap C must already be active at zero traffic"; exit 1; }
            # A failed bootstrap publication abandons this pair by deactivating C under max=1.
            # Keep ownership through every reversible pre-publish check.
            candidate_owned=true
          else
            [ "$candidate_active" = "false" ] \
              || { echo "::error::publication must own activation of an inactive candidate"; exit 1; }
            candidate_owned=true
            az_retry az containerapp revision activate -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --revision "$CANDIDATE_REVISION" >/dev/null
          fi
          # runningState is not proof that the revision answers on its own hostname, and it is not
          # proof that ARM has reconciled trafficWeight back to an integer 0. Both feed the target
          # evidence digest that verify-report compares, so reading either one early produces a
          # digest for a revision state that never existed and the publication fails with a
          # mismatch that looks like wrong evidence rather than an early read. Require the three
          # facts the digest actually depends on: it is running, it is not routing, and it serves
          # its own artifact manifest set rather than falling through to the traffic-bearing one.
          for attempt in {1..40}; do
            candidate_status=$(az_retry az containerapp revision show \
              -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --revision "$CANDIDATE_REVISION" \
              --query '{running:properties.runningState,traffic:properties.trafficWeight}' -o json)
            running=$(printf '%s' "$candidate_status" | jq -r '.running // ""')
            traffic=$(printf '%s' "$candidate_status" | jq -r '.traffic // "absent"')
            if { [ "$running" = "Running" ] || [ "$running" = "RunningAtMaxScale" ]; } \
              && [ "$traffic" = "0" ] \
              && curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
                  "https://$candidate_fqdn/attestation.json" \
                | jq -e --arg set "$TARGET_MANIFEST_SET" \
                  'tostring | test($set)' >/dev/null 2>&1; then
              break
            fi
            [ "$attempt" = "40" ] \
              && { echo "::error::candidate revision did not become ready at zero traffic on its own hostname (running=$running traffic=$traffic)"; exit 1; }
            sleep 3
          done

          dotnet run --project lex/src/Lex.Ingest/Lex.Ingest.csproj -c Release -- \
            assistant-eval verify-report \
            --report evidence/assistant-eval-report.json \
            --cases evidence/assistant-cases-v3.json \
            --review-attestation evidence/assistant-cases-v3.review.json \
            --review-signature evidence/assistant-cases-v3.review.sig \
            --admission evidence/assistant-eval-admission.json \
            --admission-signature evidence/assistant-eval-admission.sig \
            --base-url "https://$candidate_fqdn" \
            --candidate-container-app-resource-id "$app_id" \
            --candidate-revision "$CANDIDATE_REVISION"
          admission_expires_at=$(jq -er \
            '.expires_at | select(type == "string")' \
            evidence/assistant-eval-admission.json) \
            && validate_utc_expiry "$admission_expires_at" \
            || { echo "::error::verified admission expiry is malformed"; exit 1; }
          echo "admission_expires_at=$admission_expires_at" >> "$GITHUB_OUTPUT"

          export LEX_BROWSER_BASE_URL="https://$candidate_fqdn"
          export LEX_BROWSER_EVIDENCE_OUT="$GITHUB_WORKSPACE/evidence/assistant-browser-evidence.json"
          export LEX_CANDIDATE_REVISION="$CANDIDATE_REVISION"
          export LEX_CODE_COMMIT="$CODE_COMMIT"
          export LEX_ARTIFACT_MANIFEST_SET="$TARGET_MANIFEST_SET"
          export LEX_CANDIDATE_EVIDENCE_SHA256="$TARGET_EVIDENCE_SHA"
          npm --prefix lex/web run test:browser-release
          test -s evidence/assistant-browser-evidence.json
          browser_evidence_sha=$(sha256sum evidence/assistant-browser-evidence.json | cut -d' ' -f1)
          dotnet run --project lex/src/Lex.Ingest/Lex.Ingest.csproj -c Release -- \
            artifact manifest --root evidence \
            --file assistant-eval-report.json \
            --file assistant-cases-v3.json \
            --file assistant-cases-v3.review.json \
            --file assistant-cases-v3.review.sig \
            --file assistant-eval-admission.json \
            --file assistant-eval-admission.sig \
            --file assistant-browser-evidence.json \
            --manifest evidence/assistant-eval.manifest.json \
            --key-id "$ARTIFACT_KEY_ID" --code-commit "$CODE_COMMIT" \
            --source "artifact_manifest_set=$TARGET_MANIFEST_SET" \
            --source "admission_run_identity=$ADMISSION_RUN_IDENTITY" \
            --source "admission_sha256=$ADMISSION_SHA" \
            --source "browser_evidence_sha256=$browser_evidence_sha" \
            --source "candidate_evidence_sha256=$TARGET_EVIDENCE_SHA" \
            --source "candidate_revision=$CANDIDATE_REVISION" \
            --source "cases_sha256=$CASES_SHA" \
            --source "purpose=assistant-evaluation" \
            --source "report_schema=$REPORT_SCHEMA"
          digest=$(openssl dgst -sha256 -binary evidence/assistant-eval.manifest.json \
            | openssl base64 -A)
          az_retry az keyvault key sign --vault-name "$AZURE_KEY_VAULT" \
            --name "$AZURE_KEY_NAME" --version "$AZURE_KEY_VERSION" \
            --algorithm ES256 --digest "$digest" -o json \
            | jq -er 'if type == "string" then . else (.signature // .value // .result) end' \
            > evidence/assistant-eval.manifest.sig

          dotnet run --project lex/src/Lex.Ingest/Lex.Ingest.csproj -c Release -- \
            assistant-eval verify-release \
            --root evidence \
            --manifest evidence/assistant-eval.manifest.json \
            --signature evidence/assistant-eval.manifest.sig \
            --trust-roots lex/deploy/trusted-artifact-roots.json \
            --base-url "https://$candidate_fqdn" \
            --candidate-container-app-resource-id "$app_id" \
            --candidate-revision "$CANDIDATE_REVISION"

          if [ "$BOOTSTRAP_MODE" = "true" ]; then
            inactive_limit=$(az_retry az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --query properties.configuration.maxInactiveRevisions -o tsv)
            [ "$inactive_limit" = "1" ] \
              || { echo "::error::bootstrap signing requires maxInactiveRevisions=1"; exit 1; }
            az_retry az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --all -o json > evidence/bootstrap-routes.live.json
            jq -e --arg candidate "$CANDIDATE_REVISION" \
                --arg rollback "$BOOTSTRAP_ROLLBACK_REVISION" '
                  length == 3
                  and ([.[] | select(.properties.active == false) | .name] == [$rollback])
                  and ([.[] | select(.properties.active == true)] | length) == 2
                  and (any(.[]; .name == $candidate and .properties.active == true
                    and (.properties.trafficWeight // 0) == 0))
                  and (any(.[]; .name == $rollback and .properties.active == false
                    and (.properties.trafficWeight // 0) == 0))
                  and ([.[] | select((.properties.trafficWeight // 0) > 0)] | length) == 1
                  and ([.[] | select((.properties.trafficWeight // 0) == 100
                    and .properties.active == true
                    and .name != $candidate and .name != $rollback)] | length) == 1' \
              evidence/bootstrap-routes.live.json >/dev/null \
              || { echo "::error::bootstrap signing state is not exact A=100/R-inactive/C-active"; exit 1; }
            legacy_authority=$(jq -er --arg candidate "$CANDIDATE_REVISION" \
              --arg rollback "$BOOTSTRAP_ROLLBACK_REVISION" '
                .[] | select(.name != $candidate and .name != $rollback
                  and .properties.active == true and (.properties.trafficWeight // 0) == 100)
                | .name' evidence/bootstrap-routes.live.json)
            az_retry az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --revision "$BOOTSTRAP_ROLLBACK_REVISION" -o json \
              > evidence/bootstrap-rollback.live.json
            az_retry az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --revision "$CANDIDATE_REVISION" -o json \
              > evidence/bootstrap-candidate.live.json
            jq -e --arg revision "$BOOTSTRAP_ROLLBACK_REVISION" '
                (.id | type == "string")
                and .name == $revision
                and (.properties.active | type == "boolean")
                and .properties.active == false
                and (.properties.trafficWeight | type == "number")
                and (.properties.trafficWeight % 1 == 0)
                and .properties.trafficWeight == 0
                and (.properties.createdTime | type == "string")
                and (.properties.template | type == "object")
                and (.properties.template.containers | type == "array")
                and (.properties.template.containers | length == 1)
                and (.properties.template.containers[0].image | type == "string")' \
              evidence/bootstrap-rollback.live.json >/dev/null \
              || { echo "::error::bootstrap fallback live state is malformed"; exit 1; }
            jq -e --arg revision "$CANDIDATE_REVISION" '
                (.id | type == "string")
                and .name == $revision
                and (.properties.active | type == "boolean")
                and .properties.active == true
                and (.properties.trafficWeight | type == "number")
                and (.properties.trafficWeight % 1 == 0)
                and .properties.trafficWeight == 0
                and (.properties.createdTime | type == "string")
                and (.properties.template | type == "object")
                and (.properties.template.containers | type == "array")
                and (.properties.template.containers | length == 1)
                and (.properties.template.containers[0].image | type == "string")' \
              evidence/bootstrap-candidate.live.json >/dev/null \
              || { echo "::error::bootstrap candidate live state is malformed"; exit 1; }
            rollback_id=$(jq -er .id evidence/bootstrap-rollback.live.json)
            candidate_id=$(jq -er .id evidence/bootstrap-candidate.live.json)
            legacy_id=$(jq -er --arg legacy "$legacy_authority" \
              '.[] | select(.name == $legacy) | .id' evidence/bootstrap-routes.live.json)
            legacy_created=$(jq -er --arg legacy "$legacy_authority" \
              '.[] | select(.name == $legacy) | .properties.createdTime' \
              evidence/bootstrap-routes.live.json)
            [ "${rollback_id,,}" = "${app_id,,}/revisions/${BOOTSTRAP_ROLLBACK_REVISION,,}" ] \
              && [ "${candidate_id,,}" = "${app_id,,}/revisions/${CANDIDATE_REVISION,,}" ] \
              || { echo "::error::bootstrap live revision resource id changed"; exit 1; }
            expected_image="crsoufien3orem.azurecr.io/lex-web@$BOOTSTRAP_EXPECTED_IMAGE_DIGEST"
            rollback_image=$(jq -er .properties.template.containers[0].image \
              evidence/bootstrap-rollback.live.json)
            candidate_image=$(jq -er .properties.template.containers[0].image \
              evidence/bootstrap-candidate.live.json)
            [ "$rollback_image" = "$expected_image" ] \
              && [ "$candidate_image" = "$expected_image" ] \
              || { echo "::error::bootstrap R/C image is not the expected Lex ACR digest"; exit 1; }
            rollback_template_digest=$(python3 \
              lex/scripts/deploy/revision_template_digest.py \
              < evidence/bootstrap-rollback.live.json)
            candidate_template_digest=$(python3 \
              lex/scripts/deploy/revision_template_digest.py \
              < evidence/bootstrap-candidate.live.json)
            [ "$rollback_template_digest" = "$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" ] \
              && [ "$candidate_template_digest" = "$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" ] \
              || { echo "::error::bootstrap R/C canonical templates differ"; exit 1; }
            rollback_code_commit=$(jq -er \
              '[.properties.template.containers[0].env[]
                | select(.name == "LEX_CODE_COMMIT") | .value]
               | if length == 1 then .[0] else error("LEX_CODE_COMMIT is not unique") end' \
              evidence/bootstrap-rollback.live.json)
            candidate_code_commit=$(jq -er \
              '[.properties.template.containers[0].env[]
                | select(.name == "LEX_CODE_COMMIT") | .value]
               | if length == 1 then .[0] else error("LEX_CODE_COMMIT is not unique") end' \
              evidence/bootstrap-candidate.live.json)
            [ "$rollback_code_commit" = "$CODE_COMMIT" ] \
              && [ "$candidate_code_commit" = "$CODE_COMMIT" ] \
              || { echo "::error::bootstrap R/C code commit changed"; exit 1; }
            rollback_created=$(jq -er .properties.createdTime \
              evidence/bootstrap-rollback.live.json)
            candidate_created=$(jq -er .properties.createdTime \
              evidence/bootstrap-candidate.live.json)
            python3 - "$legacy_created" "$rollback_created" "$candidate_created" <<'PY'
          import datetime
          import sys

          def instant(value):
              if not value.endswith("Z"):
                  raise ValueError("createdTime is not explicit UTC")
              return datetime.datetime.fromisoformat(value[:-1] + "+00:00")

          if not instant(sys.argv[1]) < instant(sys.argv[2]) < instant(sys.argv[3]):
              raise SystemExit("bootstrap chronology must be exact A < R < C")
          PY
            generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            jq -n \
              --arg schema "lex-first-release-equivalence/1" \
              --arg generated "$generated_at" \
              --arg release "$EVALUATION_RELEASE" \
              --arg app "$app_id" \
              --arg image "$BOOTSTRAP_EXPECTED_IMAGE_DIGEST" \
              --arg template "$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" \
              --arg cases "$CASES_SHA" \
              --arg preparation "legacy-a-active-c-active-r-inactive" \
              --arg legacy "$legacy_authority" \
              --arg legacy_id "$legacy_id" \
              --arg legacy_created "$legacy_created" \
              --arg rollback "$BOOTSTRAP_ROLLBACK_REVISION" \
              --arg rollback_id "$rollback_id" \
              --arg rollback_created "$rollback_created" \
              --arg candidate "$CANDIDATE_REVISION" \
              --arg candidate_id "$candidate_id" \
              --arg candidate_created "$candidate_created" \
              '{schema:$schema,generated_at:$generated,evaluation_release:$release,
                container_app_resource_id:$app,image_digest:$image,
                canonical_template_digest:$template,
                cases_sha256:$cases,
                excluded_template_fields:["revisionSuffix"],
                preparation_state:$preparation,
                legacy_authority:{revision_name:$legacy,revision_resource_id:$legacy_id,
                  created_time:$legacy_created,active:true,traffic_weight:100},
                rollback:{revision_name:$rollback,revision_resource_id:$rollback_id,
                  created_time:$rollback_created,active:false,traffic_weight:0},
                candidate:{revision_name:$candidate,revision_resource_id:$candidate_id,
                  created_time:$candidate_created,active:true,traffic_weight:0}}' \
              > evidence/bootstrap-equivalence.json
            equivalence_sha=$(sha256sum evidence/bootstrap-equivalence.json | cut -d' ' -f1)
            dotnet run --project lex/src/Lex.Ingest/Lex.Ingest.csproj -c Release -- \
              artifact manifest --root evidence \
              --file bootstrap-equivalence.json \
              --manifest evidence/bootstrap-equivalence.manifest.json \
              --key-id "$ARTIFACT_KEY_ID" --code-commit "$CODE_COMMIT" \
              --source "candidate_revision=$CANDIDATE_REVISION" \
              --source "canonical_template_digest=$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" \
              --source "cases_sha256=$CASES_SHA" \
              --source "equivalence_sha256=$equivalence_sha" \
              --source "evaluation_release=$EVALUATION_RELEASE" \
              --source "image_digest=$BOOTSTRAP_EXPECTED_IMAGE_DIGEST" \
              --source "legacy_authority_revision=$legacy_authority" \
              --source "preparation_state=legacy-a-active-c-active-r-inactive" \
              --source "purpose=assistant-evaluation-bootstrap-equivalence" \
              --source "rollback_revision=$BOOTSTRAP_ROLLBACK_REVISION" \
              --source "schema=lex-first-release-equivalence/1"
            equivalence_manifest_digest=$(openssl dgst -sha256 -binary \
              evidence/bootstrap-equivalence.manifest.json | openssl base64 -A)
            az_retry az keyvault key sign --vault-name "$AZURE_KEY_VAULT" \
              --name "$AZURE_KEY_NAME" --version "$AZURE_KEY_VERSION" \
              --algorithm ES256 --digest "$equivalence_manifest_digest" -o json \
              | jq -er 'if type == "string" then . else (.signature // .value // .result) end' \
              > evidence/bootstrap-equivalence.manifest.sig
            dotnet run --project lex/src/Lex.Ingest/Lex.Ingest.csproj -c Release -- \
              assistant-eval verify-bootstrap-equivalence \
              --root evidence \
              --manifest evidence/bootstrap-equivalence.manifest.json \
              --signature evidence/bootstrap-equivalence.manifest.sig \
              --trust-roots lex/deploy/trusted-artifact-roots.json \
              --equivalence evidence/bootstrap-equivalence.json \
              --candidate-container-app-resource-id "$app_id" \
              --legacy-authority-revision "$legacy_authority" \
              --candidate-revision "$CANDIDATE_REVISION" \
              --rollback-revision "$BOOTSTRAP_ROLLBACK_REVISION" \
              --evaluation-release "$EVALUATION_RELEASE" \
              --canonical-template-digest "$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" \
              --image-digest "$BOOTSTRAP_EXPECTED_IMAGE_DIGEST" \
              --cases-sha256 "$CASES_SHA"
          fi

          release_assets=(
            evidence/assistant-eval-report.json
            evidence/assistant-cases-v3.json
            evidence/assistant-cases-v3.review.json
            evidence/assistant-cases-v3.review.sig
            evidence/assistant-eval-admission.json
            evidence/assistant-eval-admission.sig
            evidence/assistant-browser-evidence.json
            evidence/assistant-eval.manifest.json
            evidence/assistant-eval.manifest.sig
          )
          if [ "$BOOTSTRAP_MODE" = "true" ]; then
            release_assets+=(
              evidence/bootstrap-equivalence.json
              evidence/bootstrap-equivalence.manifest.json
              evidence/bootstrap-equivalence.manifest.sig
            )
          fi
          gh release upload "$EVALUATION_RELEASE" "${release_assets[@]}" \
            --repo "$EVALUATION_REPOSITORY" --clobber
          if [ "$BOOTSTRAP_MODE" = "true" ]; then
            # Uploads are still confined to the draft. Re-read every live revision immediately
            # before the irreversible public-release boundary, then verify the signed package
            # against that fresh snapshot.
            az_retry az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --all -o json > evidence/bootstrap-routes.readback.raw.json
            canonicalize_revision_routes evidence/bootstrap-routes.live.json \
              evidence/bootstrap-routes.expected.json
            canonicalize_revision_routes evidence/bootstrap-routes.readback.raw.json \
              evidence/bootstrap-routes.readback.json
            cmp --silent evidence/bootstrap-routes.expected.json \
              evidence/bootstrap-routes.readback.json \
              || { echo "::error::bootstrap A/R/C state changed before publication"; exit 1; }
            dotnet run --project lex/src/Lex.Ingest/Lex.Ingest.csproj -c Release -- \
              assistant-eval verify-bootstrap-equivalence \
              --root evidence \
              --manifest evidence/bootstrap-equivalence.manifest.json \
              --signature evidence/bootstrap-equivalence.manifest.sig \
              --trust-roots lex/deploy/trusted-artifact-roots.json \
              --equivalence evidence/bootstrap-equivalence.json \
              --candidate-container-app-resource-id "$app_id" \
              --legacy-authority-revision "$legacy_authority" \
              --candidate-revision "$CANDIDATE_REVISION" \
              --rollback-revision "$BOOTSTRAP_ROLLBACK_REVISION" \
              --evaluation-release "$EVALUATION_RELEASE" \
              --canonical-template-digest "$BOOTSTRAP_CANONICAL_TEMPLATE_DIGEST" \
              --image-digest "$BOOTSTRAP_EXPECTED_IMAGE_DIGEST" \
              --cases-sha256 "$CASES_SHA"
            bootstrap_routes_sha256=$(sha256sum evidence/bootstrap-routes.expected.json \
              | cut -d' ' -f1)
            [[ "$bootstrap_routes_sha256" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::bootstrap route inventory digest is invalid"; exit 1; }
            echo "bootstrap_routes_sha256=$bootstrap_routes_sha256" >> "$GITHUB_OUTPUT"
          fi
          wait_for_utc_expiry "$admission_expires_at" 1200 \
            || { echo "::error::verified admission did not expire within the publication window"; exit 1; }
          release_names="$RUNNER_TEMP/evaluation-release-names.json"
          printf '%s\n' "${release_assets[@]##*/}" \
            | jq -Rsc 'split("\n") | map(select(length > 0)) | sort' > "$release_names"
          staged_release="$RUNNER_TEMP/evaluation-release-staged.json"
          staged_tag="$RUNNER_TEMP/evaluation-release-staged-tag.json"
          fetch_release_snapshot "$staged_release"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$EVALUATION_REPOSITORY/git/ref/tags/$EVALUATION_RELEASE" > "$staged_tag"
          validate_release_snapshot draft evidence "$release_names" "$staged_release" false \
            && validate_release_tag "$staged_tag" \
            || { echo "::error::staged draft release is not exact"; exit 1; }
          release_inventory_sha256=$(jq -cS \
            '[.assets[] | {name,digest,size,state}] | sort_by(.name)' "$staged_release" \
            | sha256sum | cut -d' ' -f1)
          [[ "$release_inventory_sha256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::staged release inventory digest is invalid"; exit 1; }
          echo "release_inventory_sha256=$release_inventory_sha256" >> "$GITHUB_OUTPUT"

      - name: Export the prepared evaluation identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CODE_COMMIT" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$CASES_SHA" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::prepared evaluation identity is malformed"; exit 1; }
          echo "code_commit=$CODE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "cases_sha256=$CASES_SHA" >> "$GITHUB_OUTPUT"

  immutable_prepublication:
    needs: prepare
    if: needs.prepare.outputs.public_retry != 'true'
    permissions: {}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Recheck immutable-release setting before publication
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: /dev/null
          PATH: /usr/bin:/bin
          LEX_OPS_TOKEN: ${{ secrets.LEX_OPS_TOKEN }}
        run: |
          [[ -n "${LEX_OPS_TOKEN:-}" ]] \
            || { echo "::error::immutable-release setting read credential is unavailable"; exit 1; }
          response="$RUNNER_TEMP/immutable-release-setting.json"
          GH_TOKEN="$LEX_OPS_TOKEN" /usr/bin/gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            'repos/SFHAJJI/lex-ops/immutable-releases' > "$response"
          unset LEX_OPS_TOKEN
          /usr/bin/jq -e '
            type == "object"
            and .enabled == true
            and ((.enforced_by_owner | type) == "boolean")
          ' "$response" >/dev/null \
            || { echo "::error::Immutable Releases is not enabled immediately before publication"; exit 1; }

  publish:
    needs: [prepare, immutable_prepublication]
    if: needs.prepare.outputs.public_retry != 'true'
    permissions:
      contents: write
      id-token: write
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publication_attempted: ${{ steps.publish.outputs.publication_attempted }}
      published: ${{ steps.publish.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVALUATION_RELEASE: ${{ inputs.evaluation_release }}
      EVALUATION_RELEASE_ID: ${{ needs.prepare.outputs.evaluation_release_id }}
      EVALUATION_REPOSITORY: SFHAJJI/lex-ops
      EXPECTED_RELEASE_INVENTORY_SHA256: ${{ needs.prepare.outputs.release_inventory_sha256 }}
      WORKFLOW_COMMIT: ${{ github.sha }}
      CODE_COMMIT: ${{ needs.prepare.outputs.code_commit }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
      BOOTSTRAP_MODE: ${{ needs.prepare.outputs.bootstrap_mode }}
      ADMISSION_EXPIRES_AT: ${{ needs.prepare.outputs.admission_expires_at }}
      EXPECTED_BOOTSTRAP_ROUTES_SHA256: ${{ needs.prepare.outputs.bootstrap_routes_sha256 }}
      BOOTSTRAP_ROLLBACK_REVISION: ${{ inputs.bootstrap_rollback_revision }}
      RESOURCE_GROUP: rg-platform
      CONTAINER_APP: ca-lex-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Azure login for bounded candidate cleanup
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish only the pinned release ID
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          . scripts/assistant_evaluation_release_contract.sh
          candidate_owned=true
          cleanup_candidate() {
            [ "$candidate_owned" = true ] || return 0
            if [ "$BOOTSTRAP_MODE" = true ]; then
              validate_bootstrap_abandonment_prestate "$RESOURCE_GROUP" "$CONTAINER_APP" \
                "$CANDIDATE_REVISION" "$BOOTSTRAP_ROLLBACK_REVISION" \
                || { echo "::error::bootstrap state drifted; retain C for explicit recovery"; return 1; }
            fi
            deactivate_zero_traffic_candidate "$RESOURCE_GROUP" "$CONTAINER_APP" "$CANDIDATE_REVISION" \
              || { echo "::error::candidate revision could not be safely deactivated"; return 1; }
          }
          finish() {
            local status=$?
            trap - EXIT TERM INT
            cleanup_candidate || status=1
            exit "$status"
          }
          trap finish EXIT TERM INT
          echo "publication_attempted=false" >> "$GITHUB_OUTPUT"
          [[ "$EVALUATION_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] \
            && [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$CODE_COMMIT" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$EXPECTED_RELEASE_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            && { [ "$BOOTSTRAP_MODE" = false ] || [ "$BOOTSTRAP_MODE" = true ]; } \
            || { echo "::error::prepared publication identity is malformed"; exit 1; }
          release_names="$RUNNER_TEMP/evaluation-release-names.json"
          write_expected_release_names "$BOOTSTRAP_MODE" "$release_names"
          release_notes="Signed production release evidence for candidate revision $CANDIDATE_REVISION. Promotion independently revalidates this package against Azure and the live candidate attestation."
          if [ "$BOOTSTRAP_MODE" = true ]; then
            release_notes="$release_notes Bootstrap fallback $BOOTSTRAP_ROLLBACK_REVISION is a signed canonical-template/image equivalent first-release fallback; it is not independently evaluated."
          fi
          release_title="Lex assistant evaluation ${CODE_COMMIT:0:12}"
          publish_payload="$RUNNER_TEMP/release-publish-payload.json"
          jq -cn --arg name "$release_title" --arg body "$release_notes" \
            '{name:$name,body:$body,draft:false,prerelease:false,make_latest:"false"}' \
            > "$publish_payload"
          publication_state="$RUNNER_TEMP/publication-state.json"
          if [ "$BOOTSTRAP_MODE" = true ]; then
            [[ "$EXPECTED_BOOTSTRAP_ROUTES_SHA256" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::prepared bootstrap route identity is malformed"; exit 1; }
            az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --all -o json > "${publication_state}.raw"
            canonicalize_revision_routes "${publication_state}.raw" "$publication_state"
            publication_routes_sha256=$(sha256sum "$publication_state" | cut -d' ' -f1)
            [ "$publication_routes_sha256" = "$EXPECTED_BOOTSTRAP_ROUTES_SHA256" ] \
              || { echo "::error::bootstrap A/R/C state changed before publication"; exit 1; }
          else
            [ -z "$EXPECTED_BOOTSTRAP_ROUTES_SHA256" ] \
              || { echo "::error::standard publication received bootstrap route identity"; exit 1; }
            az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --revision "$CANDIDATE_REVISION" -o json > "$publication_state"
            jq -e --arg candidate "$CANDIDATE_REVISION" '
              .name == $candidate
              and .properties.active == true
              and (.properties.trafficWeight // 0) == 0
            ' "$publication_state" >/dev/null \
              || { echo "::error::standard candidate changed before publication"; exit 1; }
          fi
          prepublish_release="$RUNNER_TEMP/evaluation-release-prepublish.json"
          prepublish_tag="$RUNNER_TEMP/evaluation-release-prepublish-tag.json"
          fetch_release_snapshot "$prepublish_release"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$EVALUATION_REPOSITORY/git/ref/tags/$EVALUATION_RELEASE" > "$prepublish_tag"
          jq -e --slurpfile expected "$release_names" \
            --arg tag "$EVALUATION_RELEASE" --arg target main '
              .draft == true and .immutable == false and .prerelease == false
              and .tag_name == $tag and .target_commitish == $target
              and ([.assets[].name] | sort) == $expected[0]
              and all(.assets[];
                (.digest | type) == "string"
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
                and (.size | type) == "number" and (.size % 1 == 0) and .size >= 0
                and .state == "uploaded")
            ' "$prepublish_release" >/dev/null \
            && validate_release_tag "$prepublish_tag" \
            || { echo "::error::draft release changed immediately before publication"; exit 1; }
          release_inventory_sha256=$(jq -cS \
            '[.assets[] | {name,digest,size,state}] | sort_by(.name)' "$prepublish_release" \
            | sha256sum | cut -d' ' -f1)
          [ "$release_inventory_sha256" = "$EXPECTED_RELEASE_INVENTORY_SHA256" ] \
            || { echo "::error::draft release inventory differs from staged evidence"; exit 1; }
          wait_for_utc_expiry "$ADMISSION_EXPIRES_AT" 0 \
            || { echo "::error::verified admission is not expired at publication"; exit 1; }
          if [ "$BOOTSTRAP_MODE" = true ]; then
            # From the next API command onward success is ambiguous under cancellation. Bootstrap
            # C must remain active so an already-public package cannot lose its promotion target.
            candidate_owned=false
          fi
          echo "publication_attempted=true" >> "$GITHUB_OUTPUT"; \
            gh api --method PATCH -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$EVALUATION_REPOSITORY/releases/$EVALUATION_RELEASE_ID" \
              --input "$publish_payload" > "$RUNNER_TEMP/evaluation-release-published-response.json"
          jq -e --argjson id "$EVALUATION_RELEASE_ID" --arg tag "$EVALUATION_RELEASE" '
            .id == $id and .tag_name == $tag and .draft == false and .prerelease == false
          ' "$RUNNER_TEMP/evaluation-release-published-response.json" >/dev/null \
            || { echo "::error::pinned release publication response is not exact"; exit 1; }
          echo "published=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: [prepare, publish]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.public_retry != 'true'
      && needs.publish.result != 'skipped'
      && needs.publish.outputs.publication_attempted != 'false'
    permissions:
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EVALUATION_RELEASE: ${{ inputs.evaluation_release }}
      EVALUATION_RELEASE_ID: ${{ needs.prepare.outputs.evaluation_release_id }}
      EVALUATION_REPOSITORY: SFHAJJI/lex-ops
      WORKFLOW_COMMIT: ${{ github.sha }}
      CODE_COMMIT: ${{ needs.prepare.outputs.code_commit }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
      BOOTSTRAP_MODE: ${{ needs.prepare.outputs.bootstrap_mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify the published immutable evidence by release ID
        shell: bash
        run: |
          set -euo pipefail
          . scripts/assistant_evaluation_release_contract.sh
          release_names="$RUNNER_TEMP/evaluation-release-names.json"
          write_expected_release_names "$BOOTSTRAP_MODE" "$release_names"
          release_verified=false
          for attempt in {1..12}; do
            published_release="$RUNNER_TEMP/evaluation-release-published-$attempt.json"
            published_tag="$RUNNER_TEMP/evaluation-release-published-tag-$attempt.json"
            evidence="$RUNNER_TEMP/evidence-$attempt"
            if fetch_release_snapshot "$published_release" \
              && download_release_assets_by_id "$evidence" "$published_release" \
              && gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$EVALUATION_REPOSITORY/git/ref/tags/$EVALUATION_RELEASE" \
                > "$published_tag" \
              && validate_release_snapshot public "$evidence" "$release_names" \
                "$published_release" true \
              && validate_release_tag "$published_tag"; then
              release_verified=true
              break
            fi
            echo "immutable release or asset attestation is not yet exact; retrying" >&2
            [ "$attempt" = 12 ] || sleep 5
          done
          [ "$release_verified" = true ] \
            || { echo "::error::published release never became immutable and exact"; exit 1; }

      - name: Publication summary
        shell: bash
        run: |
          {
            echo "## Signed Lex assistant evaluation"
            echo
            echo "- release: \`$EVALUATION_RELEASE\`"
            echo "- candidate revision: \`$CANDIDATE_REVISION\`"
            echo "- code commit: \`$CODE_COMMIT\`"
            echo "- project-owner review signature: verified"
            echo "- Azure target and model identities: verified"
            echo "- whole-evidence Key Vault signature: verified"
            if [ "$BOOTSTRAP_MODE" = true ]; then
              echo "- bounded bootstrap state: A active/100, R inactive/0, C active/0"
              echo "- C must be promoted or explicitly abandoned before signed evidence expires"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  restore_candidate_if_unpublished:
    needs: [acquire_candidate_ownership, prepare, immutable_prepublication, publish]
    if: >-
      always()
      && needs.acquire_candidate_ownership.result == 'success'
      && needs.acquire_candidate_ownership.outputs.candidate_owned == 'true'
      && needs.publish.result != 'success'
    permissions:
      contents: read
      id-token: write
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EVALUATION_RELEASE: ${{ inputs.evaluation_release }}
      EVALUATION_RELEASE_ID: ${{ needs.acquire_candidate_ownership.outputs.evaluation_release_id }}
      EVALUATION_REPOSITORY: SFHAJJI/lex-ops
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
      BOOTSTRAP_MODE: ${{ needs.acquire_candidate_ownership.outputs.bootstrap_mode }}
      BOOTSTRAP_ROLLBACK_REVISION: ${{ inputs.bootstrap_rollback_revision }}
      PUBLICATION_ATTEMPTED: ${{ needs.publish.outputs.publication_attempted }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      RESOURCE_GROUP: rg-platform
      CONTAINER_APP: ca-lex-web
    steps:
      - name: Azure login for exact abandonment cleanup
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore one active quota authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP_MODE" = true ]; then
            if { [ "$PUBLISH_RESULT" = failure ] \
                && [ "$PUBLICATION_ATTEMPTED" = false ]; } \
              || [ "$PUBLISH_RESULT" = skipped ]; then
              [[ "$EVALUATION_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] \
                || { echo "::error::retain bootstrap C for explicit recovery: release ID is unknown"; exit 1; }
              cleanup_release="$RUNNER_TEMP/bootstrap-cleanup-release.json"
              gh api -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$EVALUATION_REPOSITORY/releases/$EVALUATION_RELEASE_ID" \
                > "$cleanup_release" \
                || { echo "::error::retain bootstrap C for explicit recovery: release state is unreadable"; exit 1; }
              jq -e --argjson id "$EVALUATION_RELEASE_ID" \
                --arg tag "$EVALUATION_RELEASE" '
                  .id == $id and .tag_name == $tag
                  and .draft == true and .immutable == false and .prerelease == false
                ' "$cleanup_release" >/dev/null \
                || { echo "::error::retain bootstrap C for explicit recovery: release is not an exact draft"; exit 1; }
            else
              echo "::error::retain bootstrap C for explicit recovery: publication outcome is ambiguous"
              exit 1
            fi
            bootstrap_app_state="$RUNNER_TEMP/bootstrap-cleanup-app.json"
            bootstrap_routes="$RUNNER_TEMP/bootstrap-cleanup-routes.json"
            az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" -o json \
              > "$bootstrap_app_state"
            jq -e '.properties.configuration.maxInactiveRevisions == 1' \
              "$bootstrap_app_state" >/dev/null \
              || { echo "::error::retain bootstrap C: maxInactiveRevisions is not 1"; exit 1; }
            az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --all -o json > "$bootstrap_routes"
            jq -e --arg candidate "$CANDIDATE_REVISION" \
              --arg rollback "$BOOTSTRAP_ROLLBACK_REVISION" '
                length == 3
                and ([.[] | select(.properties.active == false) | .name] == [$rollback])
                and ([.[] | select(.properties.active == true)] | length) == 2
                and (any(.[]; .name == $candidate and .properties.active == true
                  and (.properties.trafficWeight // 0) == 0))
                and (any(.[]; .name == $rollback and .properties.active == false
                  and (.properties.trafficWeight // 0) == 0))
                and ([.[] | select((.properties.trafficWeight // 0) > 0)] | length) == 1
                and ([.[] | select((.properties.trafficWeight // 0) == 100
                  and .properties.active == true
                  and .name != $candidate and .name != $rollback)] | length) == 1
              ' "$bootstrap_routes" >/dev/null \
              || { echo "::error::retain bootstrap C: pre-abandonment A/R/C state drifted"; exit 1; }
          fi
          for attempt in {1..6}; do
            cleanup_state="$RUNNER_TEMP/candidate-cleanup-state.json"
            az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --revision "$CANDIDATE_REVISION" -o json > "$cleanup_state" \
              || { echo "::error::candidate cleanup state is unreadable"; exit 1; }
            jq -e --arg candidate "$CANDIDATE_REVISION" '
              .name == $candidate
              and (.properties.active | type) == "boolean"
              and (.properties.trafficWeight // 0) == 0
            ' "$cleanup_state" >/dev/null \
              || { echo "::error::refusing to deactivate a live or malformed revision"; exit 1; }
            active=$(jq -r '.properties.active' "$cleanup_state")
            [ "$active" = false ] && break
            [ "$attempt" = 6 ] \
              && { echo "::error::candidate remains an active quota authority"; exit 1; }
            az containerapp revision deactivate -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --revision "$CANDIDATE_REVISION" >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          active_count=$(az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --all --query "[?properties.active==\`true\`] | length(@)" -o tsv)
          [ "$active_count" = 1 ] \
            || { echo "::error::expected exactly one active revision, found $active_count"; exit 1; }
          if [ "$BOOTSTRAP_MODE" = true ]; then
            az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --all -o json | jq -e --arg candidate "$CANDIDATE_REVISION" '
                length == 2
                and ([.[] | select(.properties.active == false) | .name] == [$candidate])
                and ([.[] | select(.properties.active == true
                  and (.properties.trafficWeight // 0) == 100)] | length) == 1
              ' >/dev/null \
              || { echo "::error::bootstrap abandonment did not retain exact A plus inactive C"; exit 1; }
          fi
