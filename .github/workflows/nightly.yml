name: nightly-fleet
on:
  schedule:
    - cron: "17 2 * * *"   # staggered off the 02:00 peak; the fleet's ONLY cron
  workflow_dispatch:
    inputs:
      force_index_publisher:
        description: "Queue one enabled publisher index even when its corpus is unchanged"
        required: false
        type: string

permissions:
  contents: write
  issues: write

# A manual recovery run can overlap the next 02:17 schedule. Serialize them so two
# writers never race on corpus heads, derived artifacts, release tags, or status.
# Preserve the active run; a later run waits and normally becomes a cheap no-op.
concurrency:
  group: nightly-fleet
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SFHAJJI/lex
          path: lex

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: hydrate generated Fleet state
        run: bash fleet-status.sh hydrate

      - name: run fleet
        env:
          GH_TOKEN: ${{ secrets.LEX_OPS_TOKEN }}
          INDEX_BUILD_MODE: prebuilt
          FORCE_INDEX_PUBLISHER: ${{ inputs.force_index_publisher }}
          SOURCE_RUN_ID_PREFIX: "gha:${{ github.run_id }}:${{ github.run_attempt }}"
        run: bash fleet.sh

      - name: publish status (one commit per night, never into code or corpus branches)
        if: always()
        run: bash fleet-status.sh publish

      - name: fleet-status issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "fleet-status: nightly failed $(date -u +%F)" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID - check per-publisher status/ records." \
            || true
