name: ops-v3

on:
  pull_request:
  push:
    branches: [v3/integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify the V3 operations boundary
        run: bash tests/ops-v3.sh
