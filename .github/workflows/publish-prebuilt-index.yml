name: publish-prebuilt-index

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: Enabled publisher id
        required: true
        type: choice
        options: [eu-eurlex, lu-legilux]
      staging_prefix:
        description: Canonical staging/<publisher>/<ticket-id> prefix
        required: true
        type: string
      queue_commit:
        description: Full fleet-status commit containing the immutable build ticket
        required: true
        type: string
      workflow_commit:
        description: Exact current lex-ops main commit containing this workflow
        required: true
        type: string
      index_sha256:
        description: Expected SHA-256 of the DB
        required: true
        type: string
      index_etag:
        description: Exact unquoted private Blob ETag of the DB
        required: true
        type: string
      index_size:
        description: Exact DB byte length
        required: true
        type: string
      vectors_sha256:
        description: Expected SHA-256 of the vector companion
        required: true
        type: string
      vectors_etag:
        description: Exact unquoted private Blob ETag of the vector companion
        required: true
        type: string
      vectors_size:
        description: Exact vector-companion byte length
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-prebuilt-${{ inputs.publisher }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.sha == inputs.workflow_commit
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Recheck immutable workflow and queue identities
        env:
          QUEUE_COMMIT: ${{ inputs.queue_commit }}
          WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUEUE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT" ]
          git fetch --no-tags origin \
            +refs/heads/fleet-status:refs/remotes/origin/fleet-status
          git merge-base --is-ancestor "$QUEUE_COMMIT" refs/remotes/origin/fleet-status

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Azure login for private staging, coordination, and signing
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish without staging cleanup
        env:
          PUBLICATION_PHASE: publish
          GH_TOKEN: ${{ secrets.LEX_OPS_TOKEN }}
          PUBLISHER: ${{ inputs.publisher }}
          STAGING_PREFIX: ${{ inputs.staging_prefix }}
          QUEUE_COMMIT: ${{ inputs.queue_commit }}
          WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          EXPECTED_INDEX_SHA256: ${{ inputs.index_sha256 }}
          EXPECTED_INDEX_ETAG: ${{ inputs.index_etag }}
          EXPECTED_INDEX_SIZE: ${{ inputs.index_size }}
          EXPECTED_VECTORS_SHA256: ${{ inputs.vectors_sha256 }}
          EXPECTED_VECTORS_ETAG: ${{ inputs.vectors_etag }}
          EXPECTED_VECTORS_SIZE: ${{ inputs.vectors_size }}
          AZURE_INDEX_STORAGE_ACCOUNT: ${{ vars.AZURE_INDEX_STORAGE_ACCOUNT }}
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          AZURE_KEY_NAME: ${{ vars.AZURE_KEY_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash publish-prebuilt-index.sh

  postflight_cleanup:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.sha == inputs.workflow_commit
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Independently recheck immutable workflow and queue identities
        env:
          QUEUE_COMMIT: ${{ inputs.queue_commit }}
          WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUEUE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT" ]
          git fetch --no-tags origin \
            +refs/heads/fleet-status:refs/remotes/origin/fleet-status
          git merge-base --is-ancestor "$QUEUE_COMMIT" refs/remotes/origin/fleet-status

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Azure login for independent postflight
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify release and remove only the exact staging snapshot
        env:
          PUBLICATION_PHASE: postflight-cleanup
          GH_TOKEN: ${{ secrets.LEX_OPS_TOKEN }}
          PUBLISHER: ${{ inputs.publisher }}
          STAGING_PREFIX: ${{ inputs.staging_prefix }}
          QUEUE_COMMIT: ${{ inputs.queue_commit }}
          WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          EXPECTED_INDEX_SHA256: ${{ inputs.index_sha256 }}
          EXPECTED_INDEX_ETAG: ${{ inputs.index_etag }}
          EXPECTED_INDEX_SIZE: ${{ inputs.index_size }}
          EXPECTED_VECTORS_SHA256: ${{ inputs.vectors_sha256 }}
          EXPECTED_VECTORS_ETAG: ${{ inputs.vectors_etag }}
          EXPECTED_VECTORS_SIZE: ${{ inputs.vectors_size }}
          AZURE_INDEX_STORAGE_ACCOUNT: ${{ vars.AZURE_INDEX_STORAGE_ACCOUNT }}
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          AZURE_KEY_NAME: ${{ vars.AZURE_KEY_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash publish-prebuilt-index.sh
