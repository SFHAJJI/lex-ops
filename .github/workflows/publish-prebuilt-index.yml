name: publish-prebuilt-index

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: Enabled publisher id
        required: true
        type: choice
        options:
          - eu-eurlex
          - lu-legilux
      staging_prefix:
        description: Private Blob prefix containing the prebuilt DB and vector file
        required: true
        type: string
      queue_commit:
        description: Full lex-ops fleet-status commit containing the immutable index-build ticket
        required: true
        type: string
      index_sha256:
        description: Expected SHA-256 of index-<publisher>.db
        required: true
        type: string
      vectors_sha256:
        description: Expected SHA-256 of index-<publisher>.vectors
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-prebuilt-${{ inputs.publisher }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve immutable build ticket
        id: ticket
        shell: bash
        env:
          QUEUE_COMMIT: ${{ inputs.queue_commit }}
          PUBLISHER: ${{ inputs.publisher }}
        run: |
          set -euo pipefail
          [[ "$QUEUE_COMMIT" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::queue commit must be a full lowercase SHA"; exit 2; }
          git fetch --no-tags origin \
            +refs/heads/fleet-status:refs/remotes/origin/fleet-status
          git cat-file -e "$QUEUE_COMMIT^{commit}"
          git merge-base --is-ancestor "$QUEUE_COMMIT" refs/remotes/origin/fleet-status \
            || { echo "::error::queue commit is not on the generated fleet-status history"; exit 2; }
          ticket_file=$(mktemp)
          git show "$QUEUE_COMMIT:status/index-queue.json" > "$ticket_file"
          bash scripts/v4-release-contract.sh validate-ticket "$ticket_file"
          jq -e --arg pub "$PUBLISHER" \
            '.mode == "prebuilt"
             and ([.entries[] | select(.collection == $pub)] | length == 1)' \
            "$ticket_file" >/dev/null
          repo=$(jq -er --arg pub "$PUBLISHER" \
            '.publishers[] | select(.enabled and .id == $pub) | .corpus_repo' publishers.json)
          ticket_repo=$(jq -er --arg pub "$PUBLISHER" \
            '.entries[] | select(.collection == $pub) | .corpus_repo' "$ticket_file")
          [ "$repo" = "$ticket_repo" ] \
            || { echo "::error::ticket corpus repository does not match the registry"; exit 2; }
          echo "build_code_commit=$(jq -er .build_code_commit "$ticket_file")" >> "$GITHUB_OUTPUT"
          echo "articles_commit=$(jq -er .articles_commit "$ticket_file")" >> "$GITHUB_OUTPUT"
          echo "corpus_commit=$(jq -er --arg pub "$PUBLISHER" '.entries[] | select(.collection == $pub) | .corpus_commit' "$ticket_file")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SFHAJJI/lex
          path: lex
          fetch-depth: 0
          ref: ${{ steps.ticket.outputs.build_code_commit }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Azure login for private staging and non-exportable signing
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate, sign, benchmark, and publish
        env:
          GH_TOKEN: ${{ secrets.LEX_OPS_TOKEN }}
          PUBLISHER: ${{ inputs.publisher }}
          STAGING_PREFIX: ${{ inputs.staging_prefix }}
          QUEUE_COMMIT: ${{ inputs.queue_commit }}
          CORPUS_COMMIT: ${{ steps.ticket.outputs.corpus_commit }}
          BUILD_CODE_COMMIT: ${{ steps.ticket.outputs.build_code_commit }}
          ARTICLES_COMMIT: ${{ steps.ticket.outputs.articles_commit }}
          EXPECTED_INDEX_SHA256: ${{ inputs.index_sha256 }}
          EXPECTED_VECTORS_SHA256: ${{ inputs.vectors_sha256 }}
          ARTIFACT_KEY_ID: ${{ vars.ARTIFACT_KEY_ID }}
          AZURE_INDEX_STORAGE_ACCOUNT: ${{ vars.AZURE_INDEX_STORAGE_ACCOUNT }}
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          AZURE_KEY_NAME: ${{ vars.AZURE_KEY_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash publish-prebuilt-index.sh
