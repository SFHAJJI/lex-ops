name: repair exact EU staging metadata

on:
  workflow_dispatch:
    inputs:
      workflow_commit:
        description: Exact reviewed lex-ops main commit containing this one-time repair
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: lex-production
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKFLOW_COMMIT: ${{ github.sha }}
      EXPECTED_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
      STORAGE_ACCOUNT: stlexindexes
      CONTAINER: lex
      PREFIX: staging/eu-eurlex/cc6890caa4455bd4efa0c5c72b1c73516e8c0843d988782cf04d5b8dbf38173c
      DB_NAME: index-eu-eurlex.db
      DB_OLD_ETAG: "0x8DEFAB361991E14"
      DB_CONTENT_MD5_BASE64: ""
      DB_SHA256: f827e089bddff64709926af4341bc0ddbfbef829a5c3e29400754aec3b649fd9
      DB_SIZE: "589156352"
      VECTORS_NAME: index-eu-eurlex.vectors
      VECTORS_OLD_ETAG: "0x8DEFAB361980DD4"
      VECTORS_CONTENT_MD5_BASE64: "ZzhDHADQX2tUFEJ3YPrRNg=="
      VECTORS_SHA256: fb600d1221ab108f5f55f287682844b9f2fa03308c5401ed7d9488ae2544b6ad
      VECTORS_SIZE: "140342576"
      QUEUE_TICKET_ID: cc6890caa4455bd4efa0c5c72b1c73516e8c0843d988782cf04d5b8dbf38173c
      BUILD_CODE_COMMIT: 27f0e02cb0da8e0fdf9f8322d3eef3b3ae09c776
      CORPUS_COMMIT: e9c4df0981c855855a1a28218cf086ddeb5bb691
      ARTICLES_COMMIT: ac8851147534b9addfa2231c4364cbd785065841
      ARTICLES_GENERATION_SHA256: 6a2fb2647dea3ba0b3391e40a0612073c626ef0966bd816cdb8b99b57135c8da
    steps:
      - name: Azure login with the production publisher identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Repair and independently re-read the exact staged pair
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [ "$WORKFLOW_COMMIT" = "$EXPECTED_WORKFLOW_COMMIT" ] \
            || { echo "::error::workflow commit is not the reviewed dispatch commit"; exit 2; }

          db="$PREFIX/$DB_NAME"
          vectors="$PREFIX/$VECTORS_NAME"
          desired_inventory=$(printf '%s\n%s\n' "$db" "$vectors" \
            | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          inventory=$(az storage blob list --auth-mode login --only-show-errors \
            --account-name "$STORAGE_ACCOUNT" --container-name "$CONTAINER" \
            --prefix "$PREFIX/" --query '[].name' -o json)
          printf '%s' "$inventory" | jq -e --argjson expected "$desired_inventory" \
            'sort == $expected' >/dev/null \
            || { echo "::error::staging prefix is not the exact two-blob inventory"; exit 1; }

          normalize_etag() {
            printf '%s' "$1" | tr -d '"\r\n'
          }

          capture_blob() {
            local name="$1" output="$2"
            az storage blob show --auth-mode login --only-show-errors \
              --account-name "$STORAGE_ACCOUNT" --container-name "$CONTAINER" \
              --name "$name" -o json > "$output"
          }

          validate_base() {
            local snapshot="$1" name="$2" size="$3" expected_md5="$4"
            jq -e --arg name "$name" --argjson size "$size" \
              --arg expected_md5 "$expected_md5" '
              .name == $name
              and .properties.blobType == "BlockBlob"
              and .properties.contentLength == $size
              and .properties.serverEncrypted == true
              and (.properties.contentSettings.cacheControl == null)
              and (.properties.contentSettings.contentDisposition == null)
              and (.properties.contentSettings.contentEncoding == null)
              and (.properties.contentSettings.contentLanguage == null)
              and (if ($expected_md5 | length) == 0
                then .properties.contentSettings.contentMd5 == null
                else .properties.contentSettings.contentMd5 == $expected_md5
                end)
            ' "$snapshot" >/dev/null
          }

          metadata_kind() {
            local snapshot="$1" sha="$2"
            if jq -e --arg sha "$sha" --arg generation "$ARTICLES_GENERATION_SHA256" \
                --arg ticket "$QUEUE_TICKET_ID" --arg build "$BUILD_CODE_COMMIT" \
                --arg corpus "$CORPUS_COMMIT" --arg articles "$ARTICLES_COMMIT" '
                .metadata == {
                  articles_commit:$articles,
                  articles_generation_sha256:$generation,
                  build_code_commit:$build,
                  collection:"eu-eurlex",
                  corpus_commit:$corpus,
                  queue_ticket_id:$ticket,
                  sha256:$sha
                }
              ' "$snapshot" >/dev/null; then
              printf 'canonical'
            elif jq -e --arg sha "$sha" --arg generation "$ARTICLES_GENERATION_SHA256" \
                --arg ticket "$QUEUE_TICKET_ID" --arg build "$BUILD_CODE_COMMIT" \
                --arg corpus "$CORPUS_COMMIT" --arg articles "$ARTICLES_COMMIT" '
                .metadata == {
                  articles_commit:$articles,
                  build_code_commit:$build,
                  collection:"eu-eurlex",
                  corpus_commit:$corpus,
                  generation_sha256:$generation,
                  queue_ticket_id:$ticket,
                  sha256:$sha
                }
              ' "$snapshot" >/dev/null; then
              printf 'legacy'
            else
              return 1
            fi
          }

          download_and_verify() {
            local name="$1" etag="$2" sha="$3" size="$4" label="$5"
            local output="$RUNNER_TEMP/$label"
            rm -f "$output"
            az storage blob download --auth-mode login --only-show-errors --overwrite true \
              --account-name "$STORAGE_ACCOUNT" --container-name "$CONTAINER" \
              --name "$name" --file "$output" --if-match "$etag" >/dev/null
            [ "$(sha256sum "$output" | cut -d' ' -f1)" = "$sha" ] \
              && [ "$(stat -c %s "$output")" = "$size" ] \
              || { echo "::error::post-repair byte hash differs for $name"; return 1; }
            rm -f "$output"
          }

          replace_metadata() {
            local name="$1" etag="$2" sha="$3"
            local updated
            updated=$(az storage blob metadata update --auth-mode login --only-show-errors \
              --account-name "$STORAGE_ACCOUNT" --container-name "$CONTAINER" \
              --name "$name" --if-match "$etag" \
              --metadata \
                "articles_commit=$ARTICLES_COMMIT" \
                "articles_generation_sha256=$ARTICLES_GENERATION_SHA256" \
                "build_code_commit=$BUILD_CODE_COMMIT" \
                "collection=eu-eurlex" \
                "corpus_commit=$CORPUS_COMMIT" \
                "queue_ticket_id=$QUEUE_TICKET_ID" \
                "sha256=$sha" \
              --query etag -o tsv)
            normalize_etag "$updated"
          }

          repair_blob() {
            local name="$1" old_etag="$2" sha="$3" size="$4" expected_md5="$5"
            local expected_type="$6" label="$7" result_name="$8"
            local before="$RUNNER_TEMP/$label-before.json"
            local after="$RUNNER_TEMP/$label-after.json"
            local etag kind content_type updated
            capture_blob "$name" "$before"
            validate_base "$before" "$name" "$size" "$expected_md5" \
              || { echo "::error::legacy staging snapshot changed for $name"; return 1; }
            etag=$(normalize_etag "$(jq -er .properties.etag "$before")")
            [[ "$etag" =~ ^0x[0-9A-F]+$ ]] \
              || { echo "::error::legacy staging snapshot changed for $name"; return 1; }
            kind=$(metadata_kind "$before" "$sha") \
              || { echo "::error::legacy staging snapshot changed for $name"; return 1; }
            content_type=$(jq -er .properties.contentSettings.contentType "$before")
            if [ "$kind" = legacy ]; then
              [ "$etag" = "$old_etag" ] && [ "$content_type" = application/octet-stream ] \
                || { echo "::error::legacy staging snapshot changed for $name"; return 1; }
            elif [ "$name" = "$vectors" ]; then
              [ "$content_type" = application/octet-stream ] \
                || { echo "::error::post-repair staging snapshot is not canonical for $name"; return 1; }
            else
              { [ "$content_type" = application/octet-stream ] \
                || [ "$content_type" = application/vnd.sqlite3 ]; } \
                || { echo "::error::post-repair staging snapshot is not canonical for $name"; return 1; }
            fi

            download_and_verify "$name" "$etag" "$sha" "$size" "$label-before.bin" \
              || return 1
            if [ "$kind" = legacy ]; then
              etag=$(replace_metadata "$name" "$etag" "$sha") \
                || { echo "::error::metadata repair failed for $name"; return 1; }
              [[ "$etag" =~ ^0x[0-9A-F]+$ ]] \
                || { echo "::error::metadata repair returned an invalid ETag for $name"; return 1; }
            fi
            if [ "$name" = "$db" ] && [ "$content_type" != application/vnd.sqlite3 ]; then
              updated=$(az storage blob update --auth-mode login --only-show-errors \
                --account-name "$STORAGE_ACCOUNT" --container-name "$CONTAINER" \
                --name "$name" --if-match "$etag" --content-type application/vnd.sqlite3 \
                --query etag -o tsv) \
                || { echo "::error::content-type repair failed for $name"; return 1; }
              etag=$(normalize_etag "$updated")
              [[ "$etag" =~ ^0x[0-9A-F]+$ ]] \
                || { echo "::error::content-type repair returned an invalid ETag for $name"; return 1; }
            fi

            capture_blob "$name" "$after"
            validate_base "$after" "$name" "$size" "$expected_md5" \
              || { echo "::error::post-repair staging snapshot is not canonical for $name"; return 1; }
            [ "$(metadata_kind "$after" "$sha")" = canonical ] \
              || { echo "::error::post-repair staging snapshot is not canonical for $name"; return 1; }
            [ "$(jq -er .properties.contentSettings.contentType "$after")" = "$expected_type" ] \
              || { echo "::error::post-repair staging snapshot is not canonical for $name"; return 1; }
            etag=$(normalize_etag "$(jq -er .properties.etag "$after")")
            [[ "$etag" =~ ^0x[0-9A-F]+$ ]] \
              || { echo "::error::post-repair snapshot returned an invalid ETag for $name"; return 1; }
            download_and_verify "$name" "$etag" "$sha" "$size" "$label-after.bin" \
              || return 1
            printf -v "$result_name" '%s' "$etag"
          }

          db_etag=''
          vectors_etag=''
          repair_blob "$db" "$DB_OLD_ETAG" "$DB_SHA256" "$DB_SIZE" \
            "$DB_CONTENT_MD5_BASE64" application/vnd.sqlite3 db db_etag
          repair_blob "$vectors" "$VECTORS_OLD_ETAG" "$VECTORS_SHA256" \
            "$VECTORS_SIZE" "$VECTORS_CONTENT_MD5_BASE64" application/octet-stream vectors vectors_etag

          final_inventory=$(az storage blob list --auth-mode login --only-show-errors \
            --account-name "$STORAGE_ACCOUNT" --container-name "$CONTAINER" \
            --prefix "$PREFIX/" --query '[].name' -o json)
          printf '%s' "$final_inventory" | jq -e --argjson expected "$desired_inventory" \
            'sort == $expected' >/dev/null \
            || { echo "::error::post-repair prefix is not the exact two-blob inventory"; exit 1; }

          {
            echo "## Exact EU staging metadata repair"
            echo "- workflow commit: \`$WORKFLOW_COMMIT\`"
            echo "- queue ticket: \`$QUEUE_TICKET_ID\`"
            echo "- DB SHA-256: \`$DB_SHA256\`"
            echo "- DB final ETag: \`$db_etag\`"
            echo "- vectors SHA-256: \`$VECTORS_SHA256\`"
            echo "- vectors final ETag: \`$vectors_etag\`"
            echo "- bytes re-uploaded or deleted: no"
          } >> "$GITHUB_STEP_SUMMARY"
